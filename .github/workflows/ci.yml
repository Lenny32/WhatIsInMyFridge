name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore WhatIsInMyFridge.sln

      - name: Build solution
        run: dotnet build WhatIsInMyFridge.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WhatIsInMyFridge.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            frontend/node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('frontend/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        working-directory: frontend
        run: deno install

      - name: Generate API types
        working-directory: frontend
        run: |
          # Create a stub api-types.ts file for CI builds
          mkdir -p src/lib
          cat > src/lib/api-types.ts << 'EOF'
          // Auto-generated stub for CI builds
          // Run 'deno task generate-api' locally to generate from OpenAPI spec
          export interface paths {
            "/api/grocery": any;
            "/api/grocery/{id}": any;
            "/api/grocery/purchased": any;
          }
          export interface components {
            schemas: {
              FoodCategory: "Dairy" | "Meat" | "Vegetables" | "Fruits" | "Grains" | "Snacks" | "Beverages" | "Condiments" | "Other";
              MeasurementUnit: "Piece" | "Gram" | "Kilogram" | "Milliliter" | "Liter" | "Teaspoon" | "Tablespoon" | "Cup" | "Ounce" | "Pound" | "Pinch";
            };
          }
          EOF

      - name: Run type checking
        working-directory: frontend
        run: deno task check

      - name: Build frontend
        working-directory: frontend
        run: deno task build

      - name: Run tests
        working-directory: frontend
        run: deno test --allow-all
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore WhatIsInMyFridge.sln

      - name: Check formatting
        run: dotnet format WhatIsInMyFridge.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint frontend
        working-directory: frontend
        run: deno lint
        continue-on-error: true
