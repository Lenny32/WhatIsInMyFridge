name: Deploy Infrastructure to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - test
          - test2
          - prod

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          REVISION_SUFFIX="$(date +%s)-${GITHUB_SHA:0:7}"
          DEPLOYMENT_NAME="deploy-${{ github.event.inputs.environment }}-$(date +%Y%m%d-%H%M%S)"
          
          if [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "RESOURCE_GROUP=rg-whatismyfridge-prod" >> $GITHUB_ENV
            echo "SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          else
            echo "RESOURCE_GROUP=rg-whatismyfridge-test" >> $GITHUB_ENV
            echo "SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          fi
          
          echo "REVISION_SUFFIX=$REVISION_SUFFIX" >> $GITHUB_ENV
          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> $GITHUB_ENV

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location germanywestcentral

      - name: Deploy Bicep Template
        run: |
          az deployment group create \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deploy/bicep/main.bicep \
            --parameters environment=${{ github.event.inputs.environment }} \
            --parameters location=germanywestcentral \
            --parameters logAnalyticsLocation=germanywestcentral \
            --parameters containerRegistryUsername=${{ github.actor }} \
            --parameters containerRegistryPassword=${{ secrets.GITHUB_TOKEN }} \
            --parameters frontendImage=ghcr.io/${{ github.repository }}/frontend:latest \
            --parameters backendImage=ghcr.io/${{ github.repository }}/backend:latest \
            --parameters jwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
            --parameters revisionSuffix=${{ env.REVISION_SUFFIX }}

      - name: Get Deployment Outputs
        id: outputs
        run: |
          FRONTEND_URL=$(az deployment group show \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.outputs.frontendUrl.value \
            --output tsv)
          
          BACKEND_URL=$(az deployment group show \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.outputs.backendUrl.value \
            --output tsv)
          
          echo "Frontend URL: $FRONTEND_URL"
          echo "Backend URL: $BACKEND_URL"
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Azure Logout
        if: always()
        run: az logout
