name: Build & Package Artifacts

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '9.0.x'
  DENO_VERSION: 'v2.x'

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore WhatIsInMyFridge.sln

      - name: Build solution
        run: dotnet build WhatIsInMyFridge.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WhatIsInMyFridge.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Publish API
        run: |
          dotnet publish backend/WhatIsInMyFridge.Api/WhatIsInMyFridge.Api.csproj \
            --configuration Release \
            --output ./publish/api \
            --no-build

      - name: Create backend artifact
        run: |
          cd publish
          tar -czf backend-${{ github.sha }}.tar.gz api/
          
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: publish/backend-${{ github.sha }}.tar.gz
          retention-days: 30

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            frontend/node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('frontend/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        working-directory: frontend
        run: deno install

      - name: Generate API types stub
        working-directory: frontend
        run: |
          mkdir -p src/lib
          cat > src/lib/api-types.ts << 'EOF'
          // Auto-generated stub for CI builds
          export interface paths {
            "/api/grocery": {
              get: {
                responses: {
                  200: {
                    content: {
                      "application/json": any[];
                    };
                  };
                };
              };
              post: {
                requestBody: {
                  content: {
                    "application/json": any;
                  };
                };
                responses: {
                  200: {
                    content: {
                      "application/json": any;
                    };
                  };
                };
              };
            };
          }
          export interface components {
            schemas: {
              FoodCategory: "Dairy" | "Cheese" | "Yogurt" | "Eggs" | "Meat" | "Poultry" | "Fish" | "Seafood" | "Vegetables" | "Fruits" | "Herbs" | "Bread" | "Pasta" | "Rice" | "Cereal" | "CannedGoods" | "Condiments" | "Sauces" | "Spices" | "Oils" | "Beverages" | "Juice" | "Soda" | "FrozenMeals" | "FrozenVegetables" | "FrozenFruits" | "IceCream" | "Snacks" | "Desserts" | "Candy" | "Leftovers" | "PreparedMeals" | "Other" | "Undefined";
              MeasurementUnit: "Pieces" | "Items" | "Grams" | "Kilograms" | "Ounces" | "Pounds" | "Milliliters" | "Liters" | "FluidOunces" | "Cups" | "Pints" | "Quarts" | "Gallons" | "Teaspoons" | "Tablespoons" | "Cans" | "Bottles" | "Jars" | "Boxes" | "Bags" | "Packages" | "Cartons" | "Undefined";
            };
          }
          EOF

      - name: Build frontend
        working-directory: frontend
        run: deno task build
        env:
          VITE_API_BASE: /api

      - name: Create frontend artifact
        run: |
          cd frontend
          tar -czf frontend-${{ github.sha }}.tar.gz dist/
          
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: frontend/frontend-${{ github.sha }}.tar.gz
          retention-days: 30

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: whatsinmyfridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/whatsinmyfridge-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/whatsinmyfridge-image.tar
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-backend, build-frontend, build-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: ./artifacts

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact
          path: ./artifacts

      - name: Generate deployment notes
        id: notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Deployment Artifacts

          This release contains ready-to-deploy build artifacts:

          ### Backend (API)
          - **File**: `backend-${{ github.sha }}.tar.gz`
          - **Deploy to**: Azure App Service, Railway, Fly.io, or any .NET hosting
          - **Extract**: `tar -xzf backend-${{ github.sha }}.tar.gz`
          - **Run**: `dotnet WhatIsInMyFridge.Api.dll`

          ### Frontend (Static Site)
          - **File**: `frontend-${{ github.sha }}.tar.gz`
          - **Deploy to**: Azure Static Web Apps, Vercel, Netlify, or any static host
          - **Extract**: `tar -xzf frontend-${{ github.sha }}.tar.gz`
          - **Serve**: Contents of `dist/` folder

          ### Environment Variables Required

          **Backend:**
          ```bash
          ASPNETCORE_ENVIRONMENT=Production
          JWT_SECRET_KEY=<your-secret-key>
          COSMOS_CONNECTION_STRING=<cosmos-db-connection>
          BLOB_STORAGE_CONNECTION_STRING=<blob-storage-connection> # Optional
          ```

          **Frontend:**
          ```bash
          VITE_API_BASE=<your-backend-url>
          ```

          ### Quick Deploy Commands

          **Extract artifacts:**
          ```bash
          tar -xzf backend-${{ github.sha }}.tar.gz -C /app/backend
          tar -xzf frontend-${{ github.sha }}.tar.gz -C /app/frontend
          ```

          **Docker alternative:**
          Docker image is also available as an artifact.

          See [DEPLOYMENT.md](DEPLOYMENT.md) for detailed deployment instructions.
          EOF

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            ./artifacts/backend-${{ github.sha }}.tar.gz
            ./artifacts/frontend-${{ github.sha }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-summary:
    name: Deployment Summary
    needs: [build-backend, build-frontend, build-docker]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: |
          echo "## 📦 Build Artifacts Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following deployment artifacts are ready:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/backend-artifact/ >> $GITHUB_STEP_SUMMARY || echo "No backend artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/frontend-artifact/ >> $GITHUB_STEP_SUMMARY || echo "No frontend artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/docker-image/ >> $GITHUB_STEP_SUMMARY || echo "No docker artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Retention**: Artifacts are kept for 30 days (7 days for Docker)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download**: Use GitHub CLI \`gh run download ${{ github.run_id }}\` or download from Actions UI" >> $GITHUB_STEP_SUMMARY
