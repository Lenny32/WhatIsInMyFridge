name: Deploy Application to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run on manual dispatch or successful build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: ${{ github.event.inputs.environment || 'test' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          ENV="${{ github.event.inputs.environment || 'test' }}"
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          REVISION_SUFFIX="$(date +%s)-${GITHUB_SHA:0:7}"
          
          echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=rg-whatismyfridge-$ENV" >> $GITHUB_ENV
          echo "FRONTEND_APP=ca-frontend-$ENV" >> $GITHUB_ENV
          echo "BACKEND_APP=ca-backend-$ENV" >> $GITHUB_ENV
          echo "REVISION_SUFFIX=$REVISION_SUFFIX" >> $GITHUB_ENV

      - name: Update Backend Container App
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || echo "")
          
          if [ -n "$FRONTEND_FQDN" ]; then
            ALLOWED_ORIGINS="https://${FRONTEND_FQDN}"
          else
            ALLOWED_ORIGINS=""
          fi
          
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --revision-suffix ${{ env.REVISION_SUFFIX }} \
            --set-env-vars "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}"

      - name: Update Frontend Container App
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --revision-suffix ${{ env.REVISION_SUFFIX }} \
            --set-env-vars "VITE_API_BASE=https://${BACKEND_FQDN}"

      - name: Get Application URLs
        run: |
          FRONTEND_URL=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          echo "### Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL:** https://${FRONTEND_URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend URL:** https://${BACKEND_URL}" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout
