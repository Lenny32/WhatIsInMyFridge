name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push unified image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.unified
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate deployment instructions
        if: github.event_name != 'pull_request'
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## 🐳 Docker Image Published

          ### Pull the image:
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          ```

          ### Quick run (with defaults):
          ```bash
          docker run -d \
            --name whatsinmyfridge \
            -p 80:80 \
            -e JWT_SECRET_KEY="your-secret-key-min-32-chars" \
            -e COSMOS_CONNECTION_STRING="your-cosmos-connection" \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          ```

          ### Run with all options:
          ```bash
          docker run -d \
            --name whatsinmyfridge \
            -p 80:80 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e JWT_SECRET_KEY="your-secret-key-min-32-chars" \
            -e COSMOS_CONNECTION_STRING="your-cosmos-connection-string" \
            -e BLOB_STORAGE_CONNECTION_STRING="your-blob-storage-connection" \
            -e CORS_ORIGINS="https://yourdomain.com,https://www.yourdomain.com" \
            -v whatsinmyfridge-data:/app/data \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          ```

          ### Using docker-compose:
          See `docker-compose.simple.yml` in the repository.

          ### Available tags:
          - `latest` - Latest main branch build
          - `main` - Main branch
          - `v*.*.*` - Semantic version tags
          - `main-<sha>` - Specific commit

          ### Environment Variables:
          | Variable | Required | Default | Description |
          |----------|----------|---------|-------------|
          | `JWT_SECRET_KEY` | ✅ Yes | - | JWT secret (min 32 chars) |
          | `COSMOS_CONNECTION_STRING` | ✅ Yes | - | Azure Cosmos DB connection |
          | `BLOB_STORAGE_CONNECTION_STRING` | ❌ No | - | Azure Blob Storage (optional) |
          | `CORS_ORIGINS` | ❌ No | `*` | Comma-separated allowed origins |
          | `ASPNETCORE_ENVIRONMENT` | ❌ No | `Production` | Environment name |

          ### Health Check:
          ```bash
          curl http://localhost/health
          ```

          ### Access the app:
          Open http://localhost in your browser after container starts.

          ---
          📦 Image: `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest`
          📝 See [DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT.md) for more details
          EOF

  test-image:
    name: Test Docker Image
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

      - name: Run container
        run: |
          docker run -d \
            --name test-container \
            -p 8080:80 \
            -e JWT_SECRET_KEY="test-secret-key-minimum-32-characters-long" \
            -e COSMOS_CONNECTION_STRING="AccountEndpoint=https://test.documents.azure.com:443/;AccountKey=test;" \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to start..."
          timeout 60s bash -c 'until docker ps | grep test-container | grep -q healthy; do sleep 2; done' || true
          sleep 10

      - name: Check health endpoint
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Check frontend loads
        run: |
          curl -f http://localhost:8080/ || exit 1

      - name: Show logs
        if: always()
        run: docker logs test-container

      - name: Cleanup
        if: always()
        run: docker rm -f test-container
