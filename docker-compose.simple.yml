version: '3.8'

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourusername/whatsinmyfridge}:latest
    container_name: whatsinmyfridge
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      # Required
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COSMOS_CONNECTION_STRING=${COSMOS_CONNECTION_STRING}
      
      # Optional
      - BLOB_STORAGE_CONNECTION_STRING=${BLOB_STORAGE_CONNECTION_STRING:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    
    volumes:
      # Persist data directory (if using local storage for photos)
      - app-data:/app/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    driver: local
